<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🛒 Savatcha - Mahsulotlar</title>
    <!-- Font Awesome (iqtisodiy ikonkalar) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
      /* ---------- ASOSIY STILLAR ---------- */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Roboto, system-ui, sans-serif;
      }
      body {
        background: #f4f7fc;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem 1rem;
      }





      

      /* sarlavha va savat tugmasi */
      .header {
        width: 100%;
        max-width: 1100px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2.5rem;
        flex-wrap: wrap;
        gap: 1rem;
      }
      .header h1 {
        font-weight: 600;
        color: #1e293b;
        letter-spacing: -0.5px;
      }
      .header h1 i {
        color: #3b82f6;
        margin-right: 8px;
      }

      .cart-btn {
        background: white;
        border: none;
        padding: 0.75rem 1.8rem;
        border-radius: 60px;
        font-size: 1.1rem;
        font-weight: 600;
        color: #1e293b;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        transition: all 0.2s ease;
        border: 1px solid #e2e8f0;
      }
      .cart-btn:hover {
        background: #f8fafc;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
        transform: scale(1.02);
      }
      .cart-btn i {
        font-size: 1.4rem;
        color: #3b82f6;
      }
      .cart-badge {
        background: #3b82f6;
        color: white;
        border-radius: 40px;
        padding: 0.15rem 0.7rem;
        font-size: 0.9rem;
        font-weight: 600;
        min-width: 28px;
        text-align: center;
      }

      /* ---------- MAHSULOTLAR GRID ---------- */
      .products-grid {
        width: 100%;
        max-width: 1100px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 2rem;
        margin-bottom: 2rem;
      }

      .product-card {
        background: white;
        border-radius: 24px;
        padding: 1.2rem 1rem 1.5rem;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.02);
        border: 1px solid #eef2f6;
        transition: 0.2s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .product-card:hover {
        transform: translateY(-4px);
        border-color: #d1d9e6;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.04);
      }

      .product-emoji {
        font-size: 4rem;
        line-height: 1.2;
        margin-bottom: 6px;
      }
      .product-name {
        font-size: 1.1rem;
        font-weight: 600;
        color: #0f172a;
      }
      .product-price {
        font-size: 1.25rem;
        font-weight: 700;
        color: #2563eb;
        margin: 6px 0 14px;
      }
      .product-price small {
        font-weight: 400;
        font-size: 0.8rem;
        color: #64748b;
        margin-left: 4px;
      }

      .add-to-cart-btn {
        background: #2563eb;
        border: none;
        color: white;
        font-weight: 600;
        padding: 0.6rem 1.8rem;
        border-radius: 60px;
        font-size: 0.95rem;
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        transition: 0.15s ease;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        border: 1px solid transparent;
      }
      .add-to-cart-btn:hover {
        background: #1d4ed8;
        transform: scale(1.02);
        box-shadow: 0 6px 16px rgba(37, 99, 235, 0.25);
      }
      .add-to-cart-btn i {
        font-size: 1rem;
      }

      /* ---------- MODAL (savat) – o'ngdan chiqadi ---------- */
      .cart-modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(15, 23, 42, 0.4);
        backdrop-filter: blur(4px);
        z-index: 999;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.25s ease,
          visibility 0.25s ease;
      }
      .cart-modal-overlay.active {
        opacity: 1;
        visibility: visible;
      }

      .cart-modal {
        position: fixed;
        top: 0;
        right: 0;
        width: 100%;
        max-width: 420px;
        height: 100vh;
        background: #ffffff;
        box-shadow: -10px 0 40px rgba(0, 0, 0, 0.08);
        z-index: 1000;
        transform: translateX(110%);
        transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        display: flex;
        flex-direction: column;
        border-left: 1px solid #e9edf2;
      }
      .cart-modal.open {
        transform: translateX(0);
      }

      /* modal ichki tuzilishi */
      .cart-modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1.5rem 1.5rem 0.8rem 1.5rem;
        border-bottom: 1px solid #eef2f6;
      }
      .cart-modal-header h2 {
        font-size: 1.3rem;
        font-weight: 700;
        color: #0f172a;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .cart-modal-header h2 i {
        color: #3b82f6;
      }
      .close-modal-btn {
        background: #f1f5f9;
        border: none;
        width: 40px;
        height: 40px;
        border-radius: 40px;
        font-size: 1.3rem;
        cursor: pointer;
        transition: 0.15s;
        color: #334155;
      }
      .close-modal-btn:hover {
        background: #e2e8f0;
        color: #0f172a;
      }

      /* savat elementlari ro'yxati */
      .cart-items-container {
        flex: 1;
        overflow-y: auto;
        padding: 1.2rem 1.2rem 0.5rem;
      }
      .cart-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.9rem 0.6rem;
        border-bottom: 1px solid #f1f5f9;
        gap: 8px;
        animation: fadeItem 0.2s ease;
      }
      @keyframes fadeItem {
        0% {
          opacity: 0.4;
          transform: translateX(10px);
        }
        100% {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .cart-item-info {
        display: flex;
        flex-direction: column;
        flex: 2;
      }
      .cart-item-name {
        font-weight: 600;
        color: #0f172a;
      }
      .cart-item-price {
        font-size: 0.9rem;
        color: #2563eb;
        font-weight: 600;
      }

      .cart-item-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .qty-btn {
        background: #f1f5f9;
        border: none;
        width: 30px;
        height: 30px;
        border-radius: 40px;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        transition: 0.1s;
        color: #1e293b;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .qty-btn:hover {
        background: #e2e8f0;
      }
      .qty-btn.remove-item {
        background: transparent;
        color: #94a3b8;
        width: 28px;
        font-size: 0.9rem;
      }
      .qty-btn.remove-item:hover {
        color: #dc2626;
        background: #fee2e2;
      }
      .item-qty {
        min-width: 24px;
        text-align: center;
        font-weight: 600;
      }

      /* savat pastki qismi – jami summa */
      .cart-footer {
        border-top: 1px solid #eef2f6;
        padding: 1.2rem 1.5rem 2rem;
        background: #fafcff;
      }
      .cart-total {
        display: flex;
        justify-content: space-between;
        font-size: 1.2rem;
        font-weight: 700;
        color: #0f172a;
      }
      .cart-total span:last-child {
        color: #2563eb;
      }
      .empty-cart-msg {
        text-align: center;
        color: #94a3b8;
        padding: 3rem 0;
        font-size: 1rem;
      }
      .empty-cart-msg i {
        font-size: 3rem;
        margin-bottom: 12px;
        color: #cbd5e1;
      }

      /* kichik moslashuv */
      @media (max-width: 480px) {
        .cart-modal {
          max-width: 100%;
        }
        .header h1 {
          font-size: 1.3rem;
        }
      }

      /* qisqa animatsiya */
      .toast-like {
        transition: 0.15s;
      }
    </style>
  </head>
  <body>
    <!-- ======== HEADER + SAVAT TUGMASI ======== -->
    <header class="header">
      <h1><i class="fas fa-store-alt"></i> Mahsulotlar</h1>
      <button class="cart-btn" id="openCartBtn">
        <i class="fas fa-shopping-bag"></i>
        <span>Savat</span>
        <span class="cart-badge" id="cartCounter">0</span>
      </button>
    </header>

    <!-- ======== MAHSULOTLAR GRID ======== -->
    <div class="products-grid" id="productsGrid">
      <!-- JS tomonidan to'ldiriladi -->
    </div>

    <!-- ======== MODAL (Savat) ======== -->
    <div class="cart-modal-overlay" id="cartOverlay"></div>
    <div class="cart-modal" id="cartModal">
      <div class="cart-modal-header">
        <h2><i class="fas fa-shopping-bag"></i> Savatcha</h2>
        <button class="close-modal-btn" id="closeCartBtn">&times;</button>
      </div>

      <div class="cart-items-container" id="cartItemsContainer">
        <!-- JS orqali ro'yxat -->
        <div class="empty-cart-msg" id="emptyCartMsg">
          <i class="fas fa-box-open"></i>
          <p>Savat hozircha bo'sh</p>
        </div>
      </div>

      <div class="cart-footer">
        <div class="cart-total">
          <span>Jami:</span>
          <span id="cartTotalPrice">0 so‘m</span>
        </div>
      </div>
    </div>

    <script>
      // ============================================================
      // 1. MAHSULOTLAR MA'LUMOTLARI (hard)
      // ============================================================
      const products = [
        { id: 1, name: "Noutbuk", emoji: "💻", price: 4200000 },
        { id: 2, name: "Smartfon", emoji: "📱", price: 2800000 },
        { id: 3, name: "Naushniklar", emoji: "🎧", price: 450000 },
        { id: 4, name: "Soat", emoji: "⌚", price: 890000 },
        { id: 5, name: "Kamera", emoji: "📷", price: 3100000 },
        { id: 6, name: "Planshet", emoji: "📟", price: 2200000 },
      ];

      // ============================================================
      // 2. SAVAT HOLATI (state)
      // ============================================================
      let cart = {}; // { productId: quantity }

      // DOM elementlari
      const productsGrid = document.getElementById("productsGrid");
      const cartItemsContainer = document.getElementById("cartItemsContainer");
      const emptyCartMsg = document.getElementById("emptyCartMsg");
      const cartTotalPriceEl = document.getElementById("cartTotalPrice");
      const cartCounter = document.getElementById("cartCounter");

      const openCartBtn = document.getElementById("openCartBtn");
      const closeCartBtn = document.getElementById("closeCartBtn");
      const cartOverlay = document.getElementById("cartOverlay");
      const cartModal = document.getElementById("cartModal");

      // ============================================================
      // 3. YORDAMCHI FUNKSIYALAR
      // ============================================================
      function formatPrice(price) {
        return new Intl.NumberFormat("uz-UZ").format(price) + " so‘m";
      }

      // Savatdagi umumiy mahsulot soni
      function getTotalItems() {
        let total = 0;
        for (let id in cart) {
          total += cart[id];
        }
        return total;
      }

      // Savatdagi umumiy summa
      function getTotalPrice() {
        let total = 0;
        for (let id in cart) {
          const product = products.find((p) => p.id === Number(id));
          if (product) {
            total += product.price * cart[id];
          }
        }
        return total;
      }

      // ============================================================
      // 4. RENDER MAHSULOTLAR (kartochkalar)
      // ============================================================
      function renderProducts() {
        productsGrid.innerHTML = "";
        products.forEach((product) => {
          const card = document.createElement("div");
          card.className = "product-card";
          card.innerHTML = `
                    <div class="product-emoji">${product.emoji}</div>
                    <div class="product-name">${product.name}</div>
                    <div class="product-price">${formatPrice(product.price)}</div>
                    <button class="add-to-cart-btn" data-id="${product.id}">
                        <i class="fas fa-plus-circle"></i> Savatga
                    </button>
                `;
          productsGrid.appendChild(card);
        });

        // barcha "savatga qo'shish" tugmalariga event
        document.querySelectorAll(".add-to-cart-btn").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            const id = Number(btn.dataset.id);
            addToCart(id);
          });
        });
      }

      // ============================================================
      // 5. SAVAT BILAN ISHLASH
      // ============================================================

      // Mahsulotni savatga qo'shish (yoki sonini ko'paytirish)
      function addToCart(productId) {
        if (cart[productId]) {
          cart[productId] += 1;
        } else {
          cart[productId] = 1;
        }
        updateCartUI();
      }

      // Mahsulot sonini o'zgartirish (ayirish yoki qo'shish)
      function updateItemQuantity(productId, delta) {
        if (!cart[productId]) return;
        const newQty = cart[productId] + delta;
        if (newQty <= 0) {
          delete cart[productId];
        } else {
          cart[productId] = newQty;
        }
        updateCartUI();
      }

      // Mahsulotni savatdan butunlay o'chirish
      function removeItem(productId) {
        delete cart[productId];
        updateCartUI();
      }

      // ============================================================
      // 6. UI NI YANGILASH (render cart + total + badge)
      // ============================================================
      function updateCartUI() {
        // 6a. Savatdagi mahsulotlar ro'yxatini chiqarish
        const items = Object.keys(cart);
        cartItemsContainer.innerHTML = "";

        if (items.length === 0) {
          // bo'sh xabar
          const emptyDiv = document.createElement("div");
          emptyDiv.className = "empty-cart-msg";
          emptyDiv.id = "emptyCartMsg";
          emptyDiv.innerHTML = `
                    <i class="fas fa-box-open"></i>
                    <p>Savat hozircha bo'sh</p>
                `;
          cartItemsContainer.appendChild(emptyDiv);
        } else {
          // har bir mahsulot uchun qator
          items.forEach((id) => {
            const product = products.find((p) => p.id === Number(id));
            if (!product) return;
            const qty = cart[id];

            const itemDiv = document.createElement("div");
            itemDiv.className = "cart-item";

            itemDiv.innerHTML = `
                        <div class="cart-item-info">
                            <span class="cart-item-name">${product.emoji} ${product.name}</span>
                            <span class="cart-item-price">${formatPrice(product.price)}</span>
                        </div>
                        <div class="cart-item-actions">
                            <button class="qty-btn dec-btn" data-id="${product.id}">−</button>
                            <span class="item-qty">${qty}</span>
                            <button class="qty-btn inc-btn" data-id="${product.id}">+</button>
                            <button class="qty-btn remove-item" data-id="${product.id}">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    `;
            cartItemsContainer.appendChild(itemDiv);
          });

          // eventlar: + / - / o'chirish
          document.querySelectorAll(".inc-btn").forEach((btn) => {
            btn.addEventListener("click", (e) => {
              const id = Number(btn.dataset.id);
              updateItemQuantity(id, 1);
            });
          });
          document.querySelectorAll(".dec-btn").forEach((btn) => {
            btn.addEventListener("click", (e) => {
              const id = Number(btn.dataset.id);
              updateItemQuantity(id, -1);
            });
          });
          document.querySelectorAll(".remove-item").forEach((btn) => {
            btn.addEventListener("click", (e) => {
              const id = Number(btn.dataset.id);
              removeItem(id);
            });
          });
        }

        // 6b. Jami summa
        const total = getTotalPrice();
        cartTotalPriceEl.textContent = formatPrice(total);

        // 6c. Badge (savatdagi umumiy son)
        const totalItems = getTotalItems();
        cartCounter.textContent = totalItems;
      }

      // ============================================================
      // 7. MODALNI OCHISH / YOPISH (o'ng tomondan animatsiya)
      // ============================================================
      function openCartModal() {
        cartModal.classList.add("open");
        cartOverlay.classList.add("active");
        document.body.style.overflow = "hidden"; // scroll blok
      }

      function closeCartModal() {
        cartModal.classList.remove("open");
        cartOverlay.classList.remove("active");
        document.body.style.overflow = "";
      }

      // eventlar
      openCartBtn.addEventListener("click", openCartModal);
      closeCartBtn.addEventListener("click", closeCartModal);
      cartOverlay.addEventListener("click", closeCartModal);

      // ESC tugmasi
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeCartModal();
      });

      // ============================================================
      // 8. ISHGA TUSHIRISH
      // ============================================================
      renderProducts();
      updateCartUI();

      // Qo'shimcha: dastlab savatga 2 ta mahsulot qo'shib qo'yamiz (ko'rinish uchun)
      // (ixtiyoriy, yoki olib tashlash mumkin)
      // addToCart(1); addToCart(3); addToCart(3);
      // Izoh: agar xohlasangiz quyidagi 2 qatorni faollashtiring.
      // addToCart(2); addToCart(4);
      // updateCartUI();
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .dark {
        background-color: #000;
        color: #fff;
      }
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        transition: 1s;
      }
      .container {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      #btn {
        width: 200px;
        height: 80px;
        border: none;
        border-radius: 20px;
        font-size: 40px;
        margin: 20px;
      }
      #btn:hover {
        transform: scale(1.2);
      }
      #btn:active {
        transform: scale(0.9);
      }
      .dark #btn {
        background-color: #666;
      }
      h1 {
        font-size: 100px;
        text-transform: uppercase;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Kunduzgi va tungi rejim</h1>

      <button id="btn">🌞</button>
    </div>

    <script>
      const btn = document.getElementById("btn");
      btn.addEventListener("click", () => {
        document.body.classList.toggle("dark");

        if (document.body.classList.contains("dark")) {
          btn.textContent = "🌑";
        } else {
          btn.textContent = "🌞";
        }
      });
    </script>
  </body>
</html>

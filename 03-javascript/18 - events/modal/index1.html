<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>modal</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        transition: 0.4s;
      }
      .container {
        width: 100%;
        height: 100vh;
        background-color: rgb(239, 239, 165);
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .modal {
        position: fixed;
        background-color: rgba(0, 0, 0, 0.7);
        inset: 0;
        display: none;
        justify-content: center;
        align-items: center;
      }
      .modal.active {
        display: flex;
      }
      .modal-container {
        width: 400px;
        height: 100px;
        border-radius: 50px;
        background-color: black;
        color: snow;
        display: flex;
        justify-content: space-around;
        align-items: center;
        font-size: 20px;
      }
      .modal-container:hover {
        transform: scale(1.9);
      }
      .modal-container button {
        background-color: red;
        border: none;
        font-size: 20px;
        color: snow;
        font-weight: bold;
        border-radius: 50%;
        padding: 10px;
        cursor: pointer;
      }
      .modal-container button:hover {
        transform: scale(1.5);
      }
      .open-btn {
        width: 120px;
        height: 60px;
        border: none;
        border-radius: 20px;
        background-color: green;
        color: snow;
        font-weight: bold;
        font-size: 20px;
        text-transform: uppercase;
      }
      .open-btn:hover {
        transform: scale(1.5);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <button class="open-btn">modal</button>
      <div class="modal">
        <div class="modal-container">
          <h2>Bu modal oyna</h2>
          <button class="close-btn"><i class="ri-close-line"></i></button>
        </div>
      </div>
    </div>

    <script>
      const openBtn = document.querySelector(".open-btn");
      const closeBtn = document.querySelector(".close-btn");
      const modal = document.querySelector(".modal");

      openBtn.addEventListener("click", () => {
        modal.classList.add("active");
      });

      closeBtn.addEventListener("click", () => {
        modal.classList.remove("active");
      });

      // har qanday joyga bosilganda
      modal.addEventListener("click", (e) => {
        if (e.target === modal) {
          modal.classList.remove("active");
        }
      });
    </script>
  </body>
</html>

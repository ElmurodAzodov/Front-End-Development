<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            transition: 0.4s;
        }
        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgb(23, 226, 182);
        }
        .modal {
            position: fixed;
            inset: 0;
            background-color: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-container {
            padding: 20px;
            width: 300px;
            height: 460px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background-color: white;
            border-radius: 10px;
        }
        .modal-container img {
            border-radius: 10px;
        }
        .modal-container button {
            padding: 10px 100px;
            border-radius: 10px;
            border: none;
            background-color: red;
            color: snow;
            font-size: 20px;
        }
        .modal-container button:hover {
            transform: scale(1.1);

        }
        .modal-container button:active {
            transform: scale(0.9);
        }
        .open-btn {
            padding: 10px 100px;
            border-radius: 10px;
            border: none;
            background-color: green;
            color: snow;
            font-size: 20px;
        }
        .open-btn:hover {
            transform: scale(1.1);

        }
        .open-btn:active {
            transform: scale(0.9);
        }
    </style>
  </head>
  <body>
    <div class="container">
        <button class="open-btn">Open</button>
        <div class="modal">
            <div class="modal-container">
                <img src="./jesse.jpg" alt="">
                <button class="close-btn">Close</button>
            </div>
        </div>
    </div>


    <script>



        const modal = document.querySelector(".modal")
        const openBtn = document.querySelector(".open-btn")
        const closeBtn = document.querySelector(".close-btn")

        openBtn.addEventListener("click", () => {
            modal.classList.add("active")
        })

        closeBtn.addEventListener("click", () => {
            modal.classList.remove("active")
        })


    </script>
  </body>
</html>

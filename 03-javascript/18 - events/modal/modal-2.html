<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Navbar Modal</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
      }

      /* =========================
           NAVBAR
        ========================= */

      .navbar {
        width: 100%;
        padding: 20px 50px;

        display: flex;
        justify-content: space-between;
        align-items: center;

        background-color: white;
      }

      .logo {
        font-size: 24px;
        font-weight: bold;
      }

      .nav-buttons {
        display: flex;
        gap: 10px;
      }

      .nav-buttons button {
        padding: 10px 20px;

        border: none;
        border-radius: 6px;

        cursor: pointer;

        font-size: 15px;
      }

      .login-btn {
        background-color: #2563eb;
        color: white;
      }

      .signup-btn {
        background-color: #16a34a;
        color: white;
      }

      /* =========================
           MODAL
        ========================= */

      .modal {
        position: fixed;
        inset: 0;

        background-color: rgba(0, 0, 0, 0.6);

        display: none;

        justify-content: center;
        align-items: center;
      }

      /* Modal ochilganda */

      .modal.active {
        display: flex;
      }

      /* =========================
           MODAL CONTENT
        ========================= */

      .modal-content {
        width: 400px;

        padding: 30px;

        background-color: white;

        border-radius: 12px;

        position: relative;
      }

      .modal-content h2 {
        margin-bottom: 20px;
      }

      /* X tugmasi */

      .close-btn {
        position: absolute;

        top: 15px;
        right: 20px;

        border: none;
        background: none;

        font-size: 25px;

        cursor: pointer;
      }

      /* =========================
           FORM
        ========================= */

      .form-group {
        margin-bottom: 15px;
      }

      .form-group label {
        display: block;

        margin-bottom: 5px;
      }

      .form-group input {
        width: 100%;

        padding: 10px;

        border: 1px solid #ccc;

        border-radius: 6px;

        outline: none;
      }

      .form-group input:focus {
        border-color: #2563eb;
      }

      .submit-btn {
        width: 100%;

        padding: 12px;

        border: none;
        border-radius: 6px;

        background-color: #2563eb;
        color: white;

        cursor: pointer;

        font-size: 16px;
      }
    </style>
  </head>

  <body>
    <!-- =========================
         NAVBAR
    ========================= -->

    <nav class="navbar">
      <div class="logo">MyWebsite</div>

      <div class="nav-buttons">
        <button class="login-btn">Login</button>

        <button class="signup-btn">Sign Up</button>
      </div>
    </nav>

    <!-- =========================
         LOGIN MODAL
    ========================= -->

    <div class="modal" id="loginModal">
      <div class="modal-content">
        <button class="close-btn">&times;</button>

        <h2>Login</h2>

        <form>
          <div class="form-group">
            <label> Email </label>

            <input type="email" placeholder="Emailingizni kiriting" />
          </div>

          <div class="form-group">
            <label> Password </label>

            <input type="password" placeholder="Parolingizni kiriting" />
          </div>

          <button class="submit-btn">Login</button>
        </form>
      </div>
    </div>

    <!-- =========================
         SIGN UP MODAL
    ========================= -->

    <div class="modal" id="signupModal">
      <div class="modal-content">
        <button class="close-btn">&times;</button>

        <h2>Sign Up</h2>

        <form>
          <div class="form-group">
            <label> Ism </label>

            <input type="text" placeholder="Ismingizni kiriting" />
          </div>

          <div class="form-group">
            <label> Email </label>

            <input type="email" placeholder="Emailingizni kiriting" />
          </div>

          <div class="form-group">
            <label> Password </label>

            <input type="password" placeholder="Parol yarating" />
          </div>

          <button class="submit-btn">Sign Up</button>
        </form>
      </div>
    </div>

    <script>
      // Navbar tugmalarini topamiz

      const loginBtn = document.querySelector(".login-btn");

      const signupBtn = document.querySelector(".signup-btn");

      // Modal oynalarni topamiz

      const loginModal = document.querySelector("#loginModal");

      const signupModal = document.querySelector("#signupModal");

      // X tugmalarini topamiz

      const closeBtns = document.querySelectorAll(".close-btn");

      // LOGIN tugmasi bosilganda

      loginBtn.addEventListener("click", function () {
        loginModal.classList.add("active");
      });

      // SIGN UP tugmasi bosilganda

      signupBtn.addEventListener("click", function () {
        signupModal.classList.add("active");
      });

      // X tugmasi bosilganda modal yopiladi

      closeBtns.forEach(function (button) {
        button.addEventListener("click", function () {
          loginModal.classList.remove("active");

          signupModal.classList.remove("active");
        });
      });
    </script>
  </body>
</html>

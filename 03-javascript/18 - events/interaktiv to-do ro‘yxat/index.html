<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />

    <title>To-Do Ro'yxat</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>📝 Vazifalar</h1>

        <button id="clearAllBtn">🗑 Barchasini o'chir</button>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>

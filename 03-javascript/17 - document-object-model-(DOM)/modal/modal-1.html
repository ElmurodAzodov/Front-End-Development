<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;
      }

      .modal {
        background-color: rgba(0, 0, 0, 0.5);
        position: fixed;
        inset: 0;
        /* display: none;
        justify-content: center;
        align-items: center; */
      }
      .modal-content {
        width: 350px;
        padding: 30px;

        background-color: white;
        border-radius: 10px;

        text-align: center;
      }
    </style>
  </head>
  <body>
    <button class="open-btn">Modalni ochish</button>

    <div class="modal">
      <div class="modal-content">
        <h2>Salom!</h2>

        <p>Bu modal oyna.</p>

        <button class="close-btn">Yopish</button>
      </div>
    </div>
  </body>
</html>

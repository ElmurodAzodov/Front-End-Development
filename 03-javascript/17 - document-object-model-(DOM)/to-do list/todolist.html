<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        * {
            padding: 0; margin: 0; box-sizing: border-box; transition: 1s;
        }
      
        .todo {
            margin: 100px auto;
            padding: 25px;
            width: 400px;
            background-color:rgb(255, 248, 237);
            border-radius: 12px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            text-transform: uppercase;
        }
        .form {
            display: flex;
            gap: 10px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 12px;
        }
        button {
            border: none;
            padding: 10px 15px;
            border-radius: 12px;
            cursor: pointer;
        }
        .add-btn {
            background-color: green;
            color: white;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin: 10px 0px;
            background-color: #f5f5f5;
            border-radius: 12px;
        }
        li span {
            cursor: pointer;
        }
        li.completed span {
            text-decoration: line-through;
            color: gray;
        }
        .delete-btn {
            background-color: red;
            color: white;
        }
        .count {
            margin: 15px 0px;
        }

    </style>
  </head>
  <body>
    <div class="todo">
        <h1>To-do list</h1>
        <div class="form">
            <input type="text" name="" id="" placeholder="Vazifangizni yozing ...">
            <button class="add-btn" id="addBtn">Qo'shish</button>
        </div>
        <ul id="todoList"><li>prosti qoshdim</li></ul>
        <div class="count">Vazifalar soni: <span id="count">0</span></div>
    </div>
    <script>


    </script>
  </body>
</html>

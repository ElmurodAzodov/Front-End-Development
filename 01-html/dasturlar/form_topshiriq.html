<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <title>Ro‘yxatdan o‘tish</title>

    <style>
      body {
        background-color: lightblue;
        color: darkblue;
      }

      h1 {
        color: darkred;
      }

      form {
        background-color: white;
      }

      input {
        background-color: lightyellow;
        color: black;
      }

      button {
        background-color: green;
        color: white;
      }
    </style>
  </head>
  <body>
    <h1>Ro‘yxatdan o‘tish</h1>

    <form>
      <label>Ismingiz:</label>
      <input type="text" placeholder="Ismingizni kiriting" />
      <br /><br />

      <label>Familiyangiz:</label>
      <input type="text" placeholder="Familiyangizni kiriting" />
      <br /><br />

      <label>Email:</label>
      <input type="email" placeholder="Email kiriting" />
      <br /><br />

      <label>Parol:</label>
      <input type="password" placeholder="Parol kiriting" />
      <br /><br />

      <label>Tug‘ilgan sana:</label>
      <input type="date" />
      <br /><br />

      <label>Jins:</label>
      <input type="radio" name="jins" /> Erkak
      <input type="radio" name="jins" /> Ayol <br /><br />

      <label>Qiziqishlar:</label>
      <input type="checkbox" /> Dasturlash <input type="checkbox" /> Dizayn
      <br /><br />

      <button type="submit">Yuborish</button>
      <button type="reset">Tozalash</button>
    </form>
  </body>
</html>

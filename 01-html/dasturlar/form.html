<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form - Foydalanuvchidan ma'lumot oluvchi sahifa</title>
  </head>
  <body>


    <h1>Form tegi</h1>
    <p>Foydalanuvchidan ma'lumot olish!</p>

    


    <form action="">
        <hr>
        <label for="id">Login:</label>
        <input type="text" name="bu yerda foydalanuvchi loginni kiritdi brat" id="id">
        <hr>

        <label for="pass">Password:</label>
        <input type="password" name="Paroli" id="pass">
        <hr>
        
        <label for="Asrorjon">Email:</label>
        <input type="email" name="emailini_kiritdi" id="Asrorjon">
        <hr>

        <label for="son">Number:</label>
        <input type="number" name="Son kiritildi" id="son">

        <hr>

        <label for="date">Date:</label>
        <input type="date" name="Sana" id="date">

        <hr>

        <b>Yoqtirgan avtomobilingiz:</b>

        <br>

        <label for="tanla">Cobalt</label>
        <input type="checkbox" name="tanladi" id="tanla">

        <label for="tanlaa">Nexia 2</label>
        <input type="checkbox" name="tanladi" id="tanlaa">

        <label for="tanlaaa">Malibu</label>
        <input type="checkbox" name="tanladi" id="tanlaaa">

        <label for="tanlaaaa">Onix</label>
        <input type="checkbox" name="tanladi" id="tanlaaaa">
        
        <hr>


        <b>Faqat birsini tanlang:</b>
        <br>
        <label for="6">6-sinf</label>
        <input type="radio" name="send" id="6">
        <br>
        <label for="7">7-sinf</label>
        <input type="radio" name="send" id="7">
        <br>
        <label for="8">8-sinf</label>
        <input type="radio" name="send" id="8">
        <br>
        <label for="9">9-sinf</label>
        <input type="radio" name="send" id="9">
        <br>
        <label for="10">10-sinf</label>
        <input type="radio" name="send" id="10">
        <br>
        <label for="11">11-sinf</label>
        <input type="radio" name="send" id="11">


        <hr>


        <label for="file">Faylingizni tanlang:</label>
        <input type="file" name="fayl_nomi" id="file">


        <hr>



        <input type="submit" value="Continue">
        <input type="reset" value="Clean">




    </form>



  </body>
</html>

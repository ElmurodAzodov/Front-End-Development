<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car Rental</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body>
    <header>
      <div class="logo">
        <img src="./assets/img/logo.png" alt="" />
        <span>Car Rental</span>
      </div>
      <div class="menu">
        <a href="#">Home</a>
        <a href="#">Vehicles</a>
        <a href="#">Details</a>
        <a href="#">About US</a>
        <a href="#">Contact US</a>
      </div>
      <div class="call">
        <img src="./assets/img/telephone.png" alt="" />
        <div class="call-number">
          <a href="#">Need help?</a>
          <a href="#">+996 247-1680</a>
        </div>
      </div>
    </header>

    <div class="hero">
      <div class="hero-left">
        <h1>Experience the road like never before</h1>
        <p>
          Aliquam adipiscing velit sember morbi. Purus non eucursus porttitor
          tristique et gravida. Quis nunc interdum gravida ullamcorper
        </p>
        <button>View all cars</button>
      </div>
      <div class="form-box">
        <h2>Book your car</h2>

        <div class="form-group">
          <select>
            <option>Car type</option>
          </select>

          <select>
            <option>Place of rental</option>
          </select>

          <select>
            <option>Place of return</option>
          </select>

          <input type="date" />
          <input type="date" />
        </div>

        <button>Book now</button>
      </div>
    </div>
  </body>
</html>

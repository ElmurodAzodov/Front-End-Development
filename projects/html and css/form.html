<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
      }
      body {
        background-image:
          linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url(./m4.jpeg);
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
      }
      .div-1 {
        width: 100%;
        height: 100vh;
      }

      .main {
        width: 600px;
        height: 500px;
        background-color: rgba(0, 0, 0, 0.5);
        color: white;
        margin: auto;
        margin-top: 100px;
        padding: 20px;
        border-radius: 12px;
        border: 1px solid black;
      }

      h2 {
        font-size: 40px;
        text-align: center;
        margin: 10px;
      }

      input {
        width: 95%;
        padding: 10px;
        border-radius: 8px;
      }
      label {
        font-size: 20px;
      }
      .tugma {
        width: 100px;
        background-color: green;
        color: white;
        border-radius: 12px;
      }
      .box {
        padding: 10px;
      }
      .bottom {
        width: 95%;
        height: 30px;
        background-color: rgb(114, 163, 206);
        text-align: center;
      }
      .box1 {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="div-1">
      <div class="main">
        <h2>Sign up with email</h2>
        <form action="">
          <div class="box">
            <label for="name">Your name:</label>
            <input type="text" id="name" placeholder="Full Name" />
          </div>
          <div class="box">
            <label for="email">Your email:</label>
            <input type="email" id="email" placeholder="Email" />
          </div>
          <div class="box box1">
            <input type="checkbox" id="s" />
            <label for="s"
              >Send me special offers, personalized recommendations, and
              learning tips.</label
            >
          </div>
          <div class="box">
            <input type="submit" value="Continue" class="tugma" />
          </div>
        </form>
        <div class="bottom">
          <span>Already have an account?</span> <a href="#">Log in</a>
        </div>
      </div>
    </div>
  </body>
</html>
